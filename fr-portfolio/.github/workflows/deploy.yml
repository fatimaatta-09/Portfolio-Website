name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you trigger manually from GitHub UI

permissions:
  contents: read
  pages:    write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Upload the site root as the Pages artifact
      #    Only the four files that make up the site go up —
      #    nothing else (no .env, no secrets, no server code).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # repo root — index.html, style.css, os-logic.js, config.js

      # 4. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
